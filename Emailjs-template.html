<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>한국AI콘텐츠연구소 강의 문의 Template</title>
    <style>
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', Arial, sans-serif;
            line-height: 1.6;
            color: #333333;
            margin: 0;
            padding: 0;
            background-color: #f7f9fc;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .header {
            background-color: #131313;
            color: #ffffff;
            padding: 25px;
            text-align: center;
            border-bottom: 3px solid #22C55E;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: -0.5px;
        }
        .header p {
            margin: 5px 0 0 0;
            font-size: 11px;
            color: #22C55E;
            font-weight: bold;
            text-transform: uppercase;
        }
        .content {
            padding: 30px;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }
        .info-table th {
            width: 30%;
            text-align: left;
            padding: 12px;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            font-size: 13px;
            font-weight: bold;
            color: #475569;
        }
        .info-table td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 13px;
            color: #1e293b;
        }
        .message-box {
            background-color: #f8fafc;
            border-left: 4px solid #22C55E;
            padding: 20px;
            border-radius: 4px;
            font-size: 14px;
            white-space: pre-wrap;
            color: #334155;
            margin-top: 15px;
        }
        .footer {
            background-color: #f1f5f9;
            padding: 15px;
            text-align: center;
            font-size: 11px;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Email Header -->
        <div class="header">
            <h1>한국AI콘텐츠연구소</h1>
            <p>Korea AI Contents Lab — 새로운 문의 도착</p>
        </div>
        
        <!-- Email Body Content -->
        <div class="content">
            <h3 style="margin-top: 0; color: #1e293b; font-size: 16px;">새로운 교육/강의 문의가 등록되었습니다.</h3>
            <p style="font-size: 13px; color: #64748b; margin-bottom: 20px;">
                웹사이트 문의 접수 양식으로부터 전송된 내용입니다. 이하의 내용을 확인해 주세요.
            </p>
            
            <table class="info-table">
                <tr>
                    <th>신청인 이름</th>
                    <td>{{fullName}}</td>
                </tr>
                <tr>
                    <th>이메일 주소</th>
                    <td>{{email}}</td>
                </tr>
                <tr>
                    <th>문의 유형</th>
                    <td>{{inquiryType}}</td>
                </tr>
            </table>

            <h4 style="margin: 0; color: #475569; font-size: 13px;">상세 문의 내용:</h4>
            <div class="message-box">{{message}}</div>
        </div>
        
        <!-- Email Footer -->
        <div class="footer">
            본 메일은 한국AI콘텐츠연구소 공식 웹사이트 문의 폼을 통해 자동 발송되었습니다.<br>
            © Korea AI Contents Lab. All rights reserved.
        </div>
    </div>
</body>
</html>
